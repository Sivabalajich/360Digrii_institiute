<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Document</title>
</head>
<body>
    <script>
         // Sum of 3 numbers
        function doSum(n1,n2,n3){
            var result=n1+n2+n3;
            document.write("sum of 3 numbers: ",result);
        }
        doSum(12,23,1)


        //Average of 6 numbers
        function doAverage(n1,n2,n3,n4,n5,n6)
        {
            var result=(n1+n2+n3+n4+n5+n6)/6;
            document.write("<br> avg of 6 numbers: ",result);
        }
        doAverage(1,3,2,5,4,6)


        //Simple interest
        function doSimpleInterest(p,t,r)
        {
            var result=(p*t*r)/100;
            document.write("<br>PTR : ",result);
        }
        doSimpleInterest(1000,6,3)


        // (a+b)^2
        function doCalc(a,b)
        {
            var result=(a+b)^2;
            document.write("<br>(a+b)^2 : ",result);
        }
        doCalc(2,23)

        //Area of circle
        function doAreaOfCircle(r)
        {
            const PI=3.14;
            var result=PI*(r*r);
            document.write("<br> Area of Circle ",result);
        }
        doAreaOfCircle(2)

        
    </script>
</body>
</html>
