<!DOCTYPE html>
<html lang="en">
<head>
    <title>Average of 6 numbers</title>
</head>
<body>
    <script>
      //with parameters and with return statement
      function doAverage1(n1,n2,n3,n4,n5,n6)
        {
            var result=(n1+n2+n3+n4+n5+n6)/6
            return result
        }
        var r1=doAverage1(1,3,2,5,4,6)
        document.write(" Avg of 6 numbers-1: ",r1)

      //without parameters and with return statement
      function doAverage2()
        {
          var n1=1
          var n2=2
          var n3=3
          var n4=5
          var n5=7
          var n6=1
          var result=(n1+n2+n3+n4+n5+n6)/6
          return result
        }
        var r2=doAverage2()
        document.write("<br> Avg of 6 numbers-2: ",r2)
      
      //with parameters and without return statement
      function doAverage3(n1,n2,n3,n4,n5,n6)
        {
            var result=(n1+n2+n3+n4+n5+n6)/6;
            return result
        }
        var r1=doAverage3(1,3,2,5,4,6)
        document.write("<br> Avg of 6 numbers-3: ",r1)

      //without parameters and without return statement
      function doAverage4()
        {
          var n1=1
          var n2=2
          var n3=3
          var n4=5
          var n5=7
          var n6=1
          var result=(n1+n2+n3+n4+n5+n6)/6
          document.write("<br> avg of 6 numbers-4: ",result)
        }
        doAverage4()

    </script>
    
</body>
</html>
