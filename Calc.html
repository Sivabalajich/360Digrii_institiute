<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //with parameters and with return statement
    function doCalc1(a,b)
        {
            var result=(a+b)^2
            return result
        }
       var r1= doCalc1(2,3)
       document.write("<br>(a+b)^2 -->1: ",r1)
      
    //without parameters and with return statement
    function doCalc2()
        {
            var a=2
            var b=3
            var result=(a+b)^2
            return result
        }
       var r2= doCalc2(2,3)
       document.write("<br>(a+b)^2 -->2: ",r2)
    //with parameters and without return statement
    function doCalc3(a,b)
        {
            var result=(a+b)^2
            document.write("<br>(a+b)^2 -->3: ",result)
        }
    doCalc3(2,3)
       
    //without parameters and without return statement
    function doCalc4()
        {
            var a=2
            var b=3
            var result=(a+b)^2
            document.write("<br>(a+b)^2 -->4: ",result)
        }
    doCalc4()
      
    </script>
</body>
</html>
