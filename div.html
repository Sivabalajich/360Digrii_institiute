<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Division Tag</title>
    <style>
        *{
            margin: 2px;
            padding: 2px;
            box-sizing: border-box;
        }
        #main{
            border: 2px solid brown ;
            width: 100%;
            height: auto;
        }
        #top{
           
            border: 2px solid rgb(66, 177, 93) ;
            height: 100px;
            width: 99%;
            

        }
        #left{
            border: 2px solid rgb(0, 132, 255);
            height: 200px;
            width: 20%;
            float: left;
            clear: both;
        }
    
        #middle{
            border:2px solid palevioletred;
            height: 200px;
            width: 56%;
            float:left;
            margin-left: 10px;
            
        }
        #right{
            border: 2px solid rgb(0, 132, 255);
            height: 200px;
            width: 20%;
            float: right;
            
        }

        #bottom{
            border:2px solid palevioletred;
            height: 100px;
            width: 100%;
            clear: both;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="top">Top</div>
        <div id="left">Left</div>
        <div id="middle">Middle</div>
        <div id="right">Right</div>
        <div id="bottom">Bottom</div>

    </div>
    
</body>
</html>
