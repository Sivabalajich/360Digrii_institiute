<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Website</title>
  <link rel="stylesheet" href="style.css">
  <style>/* General Styles */
 body {
  font-family: 'Arial', sans-serif;
  margin: 0;
  padding: 0;
}

h1, h2 {
  color: #333;
}

a {
  text-decoration: none;
}

.container {
  max-width: 1200px;
  margin: auto;
}

/* Navbar */
.navbar {
  background-color: #333;
  color: white;
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 2rem;
}

.nav-links li a {
  color: white;
  font-size: 1.2rem;
  padding: 0.5rem;
}

.burger {
  display: none;
  font-size: 2rem;
  cursor: pointer;
}

.nav-links.active {
  display: block;
}

.nav-links li {
  padding: 0.5rem;
}

/* Hero Section */
.hero {
  background: url('https://via.placeholder.com/1200x500') center/cover no-repeat;
  height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
}

.hero-content h1 {
  font-size: 3rem;
}

.hero-content p {
  font-size: 1.5rem;
  margin: 20px 0;
}

.hero .btn {
  padding: 10px 20px;
  background-color: #f54e42;
  color: white;
  font-size: 1rem;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

/* About Section */
.about {
  padding: 50px 20px;
  background-color: #f9f9f9;
  text-align: center;
}

/* Contact Section */
.contact {
  padding: 50px 20px;
  background-color: #e9e9e9;
}

.contact form {
  display: flex;
  flex-direction: column;
  max-width: 600px;
  margin: auto;
}

.contact input, .contact textarea {
  padding: 10px;
  margin: 10px 0;
  font-size: 1rem;
  border-radius: 5px;
}

.contact button {
  padding: 10px;
  background-color: #f54e42;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.response {
  margin-top: 20px;
  font-size: 1rem;
  color: green;
  display: none;
}  

/* Media Queries */
@media (max-width: 768px) {
  .nav-links {
    display: none;
    flex-direction: column;
    gap: 1rem;
  }

  .burger {
    display: block;
  }
}

</style>
<script>
  // Mobile Menu Toggle
function toggleMenu() {
  const navLinks = document.querySelector('.nav-links');
  navLinks.classList.toggle('active');
}

// Contact Form Submission
function submitForm(event) {
  event.preventDefault(); // Prevent form from reloading the page

  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const message = document.getElementById('message').value;

  // Simulate form submission (you can replace this with actual backend handling)
  document.getElementById('formResponse').innerHTML=`Thank you, ${name}! Your message has been sent.`;


  // Reset form after submission
  document.getElementById('contactForm').reset();
}

</script>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">My Website</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <div class="burger" onclick="toggleMenu()">
      &#9776;
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h1>Welcome to My Advanced Website</h1>
      <p>Your one-stop solution for amazing web experiences!</p>
      <a href="#about" class="btn">Learn More</a>
    </div>
  </section>

  <!-- About Section -->
  <section id="about" class="about">
    <h2>About Me</h2>
    <p>This is a section where you can introduce yourself, your services, or your website's purpose.</p>
  </section>

  <!-- Contact Form Section -->
  <section id="contact" class="contact">
    <h2>Contact Me</h2>
    <form id="contactForm" onsubmit="submitForm(event)">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
    <div id="formResponse" class="response"></div>
  </section>

  
</body>
</html>
